version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://quicklab:quicklab@postgres:5432/quicklab
      - QUICKLAB_WHISPER_MODEL=tiny
    depends_on:
      - redis
      - postgres
      - minio
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://quicklab:quicklab@postgres:5432/quicklab
      - QUICKLAB_WHISPER_MODEL=tiny
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quicklab
      POSTGRES_USER: quicklab
      POSTGRES_PASSWORD: quicklab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
